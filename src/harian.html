<title>Harian</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: one phone-width column, scrolling screen above a glass tab bar; chrome-pink ribbons drawn behind everything. */
:root{
  --bg1:#FBEAF2;--bg2:#F4D2E2;--bg3:#ECE3EC;--bg4:#F9E6EF;
  --ink:#3A1F2C;--muted:#6E3A55;--faint:#7A5868;
  --glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.8);--edge:rgba(255,255,255,.95);--line:#E6CBD8;
  --shadow:rgba(156,35,99,.12);--sheet:#FFF5F9;--scrim:rgba(58,20,40,.38);
  --accent:#9C2363;--danger:#B3261E;--period:#D6336C;
  --deep1:#2B1222;--deep2:#4E1A3A;--deep-ink:#FFFFFF;--deep-muted:#F6CFE1;--deep-label:#FFC2DE;
  --work:#4F5BB8;--family:#C2307A;--personal:#8A3FC0;--friends:#5E5866;
  --k1:#C2307A;--k2:#4F5BB8;--k3:#B35C00;--k4:#8A3FC0;--k5:#1F7A6D;--k6:#D6336C;--k7:#2E7D32;--k8:#5E5866;
  --heat0:rgba(255,255,255,.9);--heat1:#F8C9DD;--heat2:#EC8FBA;
  --title:linear-gradient(180deg,#C64A8A 0%,#5E1239 46%,#9C2363 56%,#D86FA3 100%);--title-glow:#FFFFFF;
  --chrome:linear-gradient(150deg,#FFC7E0 0%,#E0559A 45%,#9C2363 100%);
  --chip-on:linear-gradient(180deg,#FFE6F1 0%,#F59AC4 45%,#E679AE 55%,#FFD6E8 100%);
  --rib-op:.5;
  --display:'Unbounded',ui-rounded,system-ui,sans-serif;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --pixel:'Silkscreen',ui-monospace,'Courier New',monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg1:#24101C;--bg2:#2E1426;--bg3:#1B1220;--bg4:#26111D;
  --ink:#F8E7EF;--muted:#D9B3C6;--faint:#BE9BAD;
  --glass:rgba(255,255,255,.08);--glass-strong:rgba(40,18,32,.85);--edge:rgba(255,255,255,.16);--line:#5A3A4C;
  --shadow:rgba(0,0,0,.35);--sheet:#2A1522;--scrim:rgba(0,0,0,.55);
  --accent:#FF8CC4;--danger:#FF8A80;--period:#FF6F9C;
  --deep1:#3B1531;--deep2:#5E1F47;
  --work:#9AA3F0;--family:#F27DB5;--personal:#C79BF0;--friends:#C4BCCB;
  --k1:#F27DB5;--k2:#9AA3F0;--k3:#FFB066;--k4:#C79BF0;--k5:#5ED1BE;--k6:#FF6F9C;--k7:#8BD48E;--k8:#C4BCCB;
  --heat0:rgba(255,255,255,.06);--heat1:#5E2A47;--heat2:#A3437A;
  --title:linear-gradient(180deg,#FFFFFF 0%,#FFB3D6 45%,#E679AE 56%,#FFE3F0 100%);--title-glow:transparent;
  --rib-op:.16;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg1:#24101C;--bg2:#2E1426;--bg3:#1B1220;--bg4:#26111D;
  --ink:#F8E7EF;--muted:#D9B3C6;--faint:#BE9BAD;
  --glass:rgba(255,255,255,.08);--glass-strong:rgba(40,18,32,.85);--edge:rgba(255,255,255,.16);--line:#5A3A4C;
  --shadow:rgba(0,0,0,.35);--sheet:#2A1522;--scrim:rgba(0,0,0,.55);
  --accent:#FF8CC4;--danger:#FF8A80;--period:#FF6F9C;
  --deep1:#3B1531;--deep2:#5E1F47;
  --work:#9AA3F0;--family:#F27DB5;--personal:#C79BF0;--friends:#C4BCCB;
  --k1:#F27DB5;--k2:#9AA3F0;--k3:#FFB066;--k4:#C79BF0;--k5:#5ED1BE;--k6:#FF6F9C;--k7:#8BD48E;--k8:#C4BCCB;
  --heat0:rgba(255,255,255,.06);--heat1:#5E2A47;--heat2:#A3437A;
  --title:linear-gradient(180deg,#FFFFFF 0%,#FFB3D6 45%,#E679AE 56%,#FFE3F0 100%);--title-glow:transparent;
  --rib-op:.16;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}

html,body{height:100%}
body{background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 38%,var(--bg3) 68%,var(--bg4) 100%);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
.decor{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
.screen{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:14px}
.banner{position:relative;z-index:2;margin:10px 18px 0;padding:10px 12px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);font-size:13px}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;position:relative}
.eyebrow{font-family:var(--pixel);font-size:12px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.label{font-family:var(--pixel);font-size:11px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase}
.h-greet{margin:6px 0 0;font-family:var(--display);font-size:21px;font-weight:600;line-height:1.15;text-wrap:balance}
.h-title{display:inline-block;font-family:var(--display);font-size:30px;font-weight:800;line-height:1.08;background:var(--title);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 var(--title-glow))}
.head-r{display:flex;align-items:center;gap:8px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:36px;font-size:13px;font-weight:700;color:var(--accent)}
.icon-btn{width:44px;height:44px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--edge);color:var(--muted);backdrop-filter:blur(12px);flex-shrink:0}
.fab{width:46px;height:46px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:var(--chrome);border:1px solid #FFFFFF;box-shadow:inset 0 1px 1px rgba(255,255,255,.8),0 4px 12px rgba(156,35,99,.4);color:#FFFFFF;flex-shrink:0}
.score{display:flex;align-items:center;gap:8px;padding:6px 12px 6px 8px;border-radius:99px;background:var(--glass);border:1px solid var(--edge);backdrop-filter:blur(12px)}
.score b{font-family:var(--display);font-size:15px;color:var(--accent);display:block;line-height:1.1}
.score small{font-size:11px;font-weight:600;color:var(--muted)}

.glass{background:var(--glass);border:1px solid var(--edge);box-shadow:0 6px 16px var(--shadow),inset 0 1px 0 var(--edge);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.deep{border-radius:20px;padding:14px 16px;color:var(--deep-ink);background:radial-gradient(circle at 90% 0%,rgba(255,120,190,.55) 0%,rgba(255,120,190,0) 55%),linear-gradient(150deg,var(--deep1) 0%,var(--deep2) 60%,var(--deep1) 100%);border:1px solid rgba(255,182,220,.5);box-shadow:0 10px 26px rgba(94,18,57,.3),inset 0 1px 0 rgba(255,255,255,.25);display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.deep .label{color:var(--deep-label)}
.deep .sub{font-size:12px;color:var(--deep-muted)}
.deep-title{font-size:16px;font-weight:700}
.deep .link{color:#FFD6E8}
.deep-row{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.1);border:1px solid rgba(255,182,220,.25);display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:16px}
.stat span{font-size:11px;color:var(--deep-muted)}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.mini li{display:flex;gap:8px;align-items:baseline}
.mini time{font-size:11px;color:var(--deep-muted);min-width:58px}
.wrap-in{display:flex;gap:8px;align-items:center;height:46px;padding:0 6px 0 14px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,182,220,.4)}
.wrap-in input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:#FFFFFF;font-size:16px}
.wrap-in input::placeholder{color:#F2C3D9}
.wrap-in .fab{width:36px;height:36px}
.btn-light{min-height:40px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.14);border:1px solid rgba(255,182,220,.45);color:#FFFFFF;font-size:13px;font-weight:700}

.week{display:flex;justify-content:space-between;padding:6px 4px;border-radius:20px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;width:44px;padding:2px 0}
.wd-l{font-size:11px;font-weight:600;color:var(--muted)}
.wd-n{width:32px;height:32px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.wd.is-today .wd-n{background:var(--chrome);color:#FFFFFF;border:1.5px solid #FFFFFF}
.wd-dot{width:5px;height:5px;border-radius:99px}
.wd-dot.on{background:var(--family)}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 4px;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:6px;flex-shrink:0;height:38px;padding:0 15px;border-radius:99px;font-size:13px;font-weight:700;background:var(--glass);border:1px solid var(--edge);color:var(--ink);backdrop-filter:blur(10px)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:#4A1230;border-color:#FFFFFF;box-shadow:0 4px 14px rgba(194,48,122,.35),inset 0 1px 0 #FFFFFF}
.dot{display:inline-block;border-radius:99px;background:var(--c);flex-shrink:0}

.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{font-size:13px;font-weight:700;color:var(--accent);min-height:32px;display:inline-flex;align-items:center}
.habits{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.hab{flex:0 0 82px;min-height:84px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:18px}
.hab-ring{width:34px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:3px solid var(--c);color:var(--c);background:var(--glass-strong)}
.hab.met .hab-ring{background:var(--chrome);border:1.5px solid #FFFFFF;color:#FFFFFF}
.hab-n{font-size:11px;font-weight:600;line-height:1.25;text-align:center}

.routine{border-radius:20px;padding:6px 14px}
.rt-part{padding:8px 0 2px}
.rt{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;text-align:left;font-size:14px;font-weight:600}
.rt .box{width:24px;height:24px}
.rt-row{display:flex;flex-wrap:wrap;align-items:center}
.rt-row .rt{flex:1;min-width:0}
.atts{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding:0 0 8px 36px}
.att{display:inline-flex;align-items:center;gap:5px;min-height:32px;max-width:100%;padding:0 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--glass-strong);border:1px solid var(--line);color:var(--accent)}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.att-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line)}
.att-item .grow{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.media-v{width:100%;max-width:100%;max-height:60vh;border-radius:16px;display:block;background:#000}
.rt.done span:last-child{color:var(--faint);text-decoration:line-through}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:18px;width:100%}
.check{flex-shrink:0;width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;border:2px solid var(--c);background:var(--glass-strong)}
.check.on{background:var(--chrome);border:1.5px solid #FFFFFF;box-shadow:0 2px 6px rgba(156,35,99,.35)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;min-height:44px;justify-content:center}
.row-title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-title.done{color:var(--faint);text-decoration:line-through}
.row-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.amt{font-family:var(--display);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--accent);color:#FFFFFF;letter-spacing:.02em;white-space:nowrap}
.pill.ex{background:var(--glass-strong);color:var(--muted);border:1px solid var(--line)}
.empty{padding:18px 14px;border-radius:18px;text-align:center;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.btn{min-height:44px;padding:0 18px;border-radius:99px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-chrome{background:var(--chip-on);color:#4A1230;border:1px solid #FFFFFF;box-shadow:0 4px 14px rgba(194,48,122,.3),inset 0 1px 0 #FFFFFF}
.btn-ghost{background:var(--glass);border:1px solid var(--edge);color:var(--ink)}
.btn-danger{color:var(--danger);border:1px solid var(--danger);background:transparent}
.btn-danger.armed{background:var(--danger);color:#FFFFFF}

.bar{height:8px;border-radius:99px;background:rgba(156,35,99,.14);overflow:hidden;display:block}
.bar>span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#FFC7E0 0%,#E0559A 55%,#9C2363 100%)}
.deep .bar{background:rgba(255,255,255,.16)}
.deep .bar>span{background:linear-gradient(90deg,#FFFFFF 0%,#FFB3D6 40%,#E679AE 100%);box-shadow:0 0 10px rgba(255,150,200,.7)}

.dock{position:relative;z-index:2;padding:8px 18px}
.capture{display:flex;align-items:center;gap:8px;height:50px;padding:0 6px 0 16px;border-radius:99px;background:var(--glass-strong);border:1px solid var(--edge);box-shadow:0 6px 18px var(--shadow);backdrop-filter:blur(14px)}
.capture input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px}
.capture input::placeholder{color:var(--faint)}
.capture .fab{width:38px;height:38px}

.tabbar{position:relative;z-index:2;display:flex;justify-content:space-around;padding:4px 4px 8px;background:var(--glass-strong);border-top:1px solid var(--edge);backdrop-filter:blur(16px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;min-height:50px;justify-content:center;font-size:11px;font-weight:600;color:var(--muted)}
.tab[aria-current="page"]{color:var(--accent);font-weight:800}

.cal{border-radius:22px;padding:10px 8px;display:flex;flex-direction:column;gap:4px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-h{text-align:center;font-family:var(--pixel);font-size:11px;color:var(--muted);padding:2px 0}
.cal-d{height:52px;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:3px}
.cal-n{width:34px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.cal-d.is-sel .cal-n{border:2px solid var(--family);background:var(--glass-strong);font-weight:800}
.cal-d.is-today .cal-n{background:var(--chrome);color:#FFFFFF;border:1.5px solid #FFFFFF;font-weight:800}
.cal-dots{display:flex;gap:2px;height:5px}
.cal-dots .dot{width:5px;height:5px}
.pm{width:16px;height:4px;border-radius:99px}
.pm.on{background:var(--period)}
.pm.pred{border:1.5px dashed var(--period);height:5px}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px}
.search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px}
.search input::placeholder{color:var(--faint)}
.ngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:18px;text-align:left;min-height:120px;min-width:0}
.note h3{margin:0;font-size:14px;font-weight:700;line-height:1.3;display:flex;justify-content:space-between;gap:6px}
.note p{margin:0;flex:1;font-size:12px;line-height:1.45;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;word-break:break-word}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.mood{width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,182,220,.35);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center}

.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:20px;text-align:left;min-height:132px;min-width:0}
.tile-i{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--chrome);color:#FFFFFF;border:1px solid #FFFFFF;box-shadow:0 3px 10px rgba(156,35,99,.3)}
.tile b{font-size:16px;font-weight:700}
.tile span{font-size:12px;color:var(--muted)}

.seg2{display:flex;padding:4px;border-radius:14px}
.seg2 button{flex:1;height:38px;border-radius:11px;font-size:13px;font-weight:600}
.seg2 button[aria-selected="true"]{background:var(--chip-on);color:#4A1230;font-weight:800;border:1px solid #FFFFFF;box-shadow:0 3px 10px rgba(194,48,122,.3)}
.goal{border-radius:22px;display:flex;flex-direction:column;overflow:hidden}
.goal-cover{display:block;width:100%;aspect-ratio:16/9;max-width:100%;object-fit:cover;background:var(--heat1)}
.goal-body{padding:14px;display:flex;flex-direction:column;gap:10px}
.goal-head{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.goal-top{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.goal-pct{font-family:var(--display);font-size:13px;font-weight:800;color:var(--accent)}
.goal-t{font-size:17px;font-weight:700;line-height:1.3}
.goal-why{font-size:13px;color:var(--muted);line-height:1.45}
.steps{list-style:none;margin:0;padding:4px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;text-align:left}
.box{flex-shrink:0;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;border:2px solid var(--accent);background:var(--glass-strong)}
.box.on{background:var(--chrome);border:1.5px solid #FFFFFF}
.goal-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph time{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:rgba(43,18,34,.75);color:#FFFFFF}
.ph-add{aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer}
.big-ph{width:100%;max-width:100%;border-radius:16px;display:block}

.heat{border-radius:22px;padding:12px;display:flex;flex-direction:column;gap:8px}
.heat-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.hc{height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.hc.l0{background:var(--heat0);border:1px solid var(--line);color:var(--faint)}
.hc.l1{background:var(--heat1);color:var(--ink)}
.hc.l2{background:var(--heat2);color:var(--ink)}
.hc.l3{background:var(--chrome);color:#FFFFFF}
.hc.fut{background:transparent;border:1px dashed var(--line);color:var(--faint)}
.hc.tod{outline:2px solid var(--accent);outline-offset:1px}
.moodbars{display:flex;align-items:flex-end;justify-content:space-between;height:96px;padding:0 4px}
.mb{display:flex;flex-direction:column;align-items:center;gap:4px;width:34px;font-size:11px;font-weight:700;color:var(--muted)}
.mb span{width:26px;border-radius:9px 9px 4px 4px;background:linear-gradient(180deg,#FFE6F1 0%,#F59AC4 40%,#C2307A 100%);border:1px solid #FFFFFF}
.mb span.none{background:transparent;border:1px dashed var(--line);height:8px}
.days{display:flex;justify-content:space-between;padding:0 4px}
.days span{width:34px;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.days span.t{color:var(--accent);font-weight:800}
.bal{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--glass-strong)}
.bal span{height:100%}
.bal-l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.bal-l div{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.bal-l strong{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.card{border-radius:22px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}

.bmi-scale{position:relative;display:flex;gap:2px;height:10px;margin-top:4px}
.bmi-scale span{height:100%}
.bmi-scale span:first-child{border-radius:99px 0 0 99px}
.bmi-scale span:nth-child(4){border-radius:0 99px 99px 0}
.bmi-scale i{position:absolute;top:-6px;width:6px;height:22px;border-radius:3px;background:#FFFFFF;transform:translateX(-50%);box-shadow:0 0 0 2px var(--deep2),0 2px 6px rgba(0,0,0,.4)}
.bmi-ticks{position:relative;height:14px;font-size:10px;font-weight:700;color:var(--deep-muted)}
.bmi-ticks span{position:absolute;transform:translateX(-50%)}
.big-amt{font-family:var(--display);font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
.cat-row{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12px}
.cat-row .bar>span{background:var(--c)}
.day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:700;color:var(--muted);padding:4px 4px 0}

.song-st{display:inline-flex;align-items:center;gap:6px;min-height:32px;padding:0 10px;border-radius:99px;font-size:11px;font-weight:700;border:1px solid var(--line);background:var(--glass-strong);white-space:nowrap}
.song-st.learning{background:var(--chip-on);color:#4A1230;border-color:#FFFFFF}
.song-st.learned{background:var(--chrome);color:#FFFFFF;border-color:#FFFFFF}
.song-note{font-size:12px;color:var(--muted);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:480px;max-height:90%;overflow-y:auto;background:var(--sheet);border-radius:26px 26px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(94,18,57,.25);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{margin:0;font-family:var(--display);font-size:19px;font-weight:800}
.field{display:flex;flex-direction:column;gap:6px;border:none;margin:0;padding:0;min-width:0}
.field>label,.field legend{font-size:13px;font-weight:700;color:var(--muted);padding:0}
.inp{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass-strong);font-size:16px;color:var(--ink)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.45}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg-o{position:relative}
.seg-o input{position:absolute;opacity:0;inset:0;margin:0}
.seg-o span{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass-strong);font-size:13px;font-weight:700}
.seg-o input:checked+span{background:var(--chip-on);color:#4A1230;border-color:#FFFFFF;box-shadow:0 3px 10px rgba(194,48,122,.3)}
.seg-o input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tick{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;font-weight:600}
.tick input{width:22px;height:22px;accent-color:#C2307A}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:1em;margin:0}
.hint{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.mlist{display:flex;flex-direction:column;gap:8px}
.amt-in{font-family:var(--display);font-size:28px;font-weight:800;text-align:center;min-height:64px}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;max-width:calc(100% - 40px);padding:10px 16px;border-radius:99px;background:var(--deep1);color:#FFFFFF;font-size:13px;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}#toast{transition:none}}

/* ---------- dates ---------- */
function pad(n){ return (n < 10 ? '0' : '') + n; }
function ymd(d){ return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
function parseYmd(s){ var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2]); }
function addDays(s, n){ var d = parseYmd(s); d.setDate(d.getDate() + n); return ymd(d); }
function diffDays(a, b){ return Math.round((parseYmd(b) - parseYmd(a)) / 864e5); }
function today(){ return ymd(new Date()); }
function nowHM(){ var d = new Date(); return pad(d.getHours()) + ':' + pad(d.getMinutes()); }
function fmtTime(hm){ if (!hm) return 'Any time'; var h = +hm.slice(0, 2), m = hm.slice(3, 5); return (h % 12 || 12) + ':' + m + ' ' + (h < 12 ? 'AM' : 'PM'); }
function fmtHour(h){ return (h % 12 || 12) + ':00 ' + (h < 12 ? 'AM' : 'PM'); }
function fmtShort(s){ var d = parseYmd(s); return MON[d.getMonth()].slice(0, 3) + ' ' + d.getDate(); }
function fmtLong(s){ var d = parseYmd(s); return WD[d.getDay()] + ', ' + fmtShort(s); }
function relDay(s){ var t = today(); if (s === t) return 'Today'; if (s === addDays(t, 1)) return 'Tomorrow'; if (s === addDays(t, -1)) return 'Yesterday'; return fmtLong(s); }
function rm(n){ return 'RM ' + (Math.round(n * 100) / 100).toFixed(2); }

/* ---------- helpers ---------- */
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function sc(s){ return 'var(--' + String(s).toLowerCase() + ')'; }
function cc(cat){ for (var i = 0; i < CATS.length; i++) if (CATS[i][0] === cat) return 'var(--' + CATS[i][1] + ')'; return 'var(--k8)'; }
function dot(s, size){ size = size || 8; return '<span class="dot" style="--c:' + sc(s) + ';width:' + size + 'px;height:' + size + 'px"></span>'; }
function cdot(cat){ return '<span class="dot" style="--c:' + cc(cat) + ';width:8px;height:8px"></span>'; }
function occurs(it, d){
  if (it.repeat === 'daily') return d >= it.date;
  if (it.repeat === 'weekly') return d >= it.date && parseYmd(d).getDay() === parseYmd(it.date).getDay();
  return it.date === d;
}
function itemsOn(d, f){
  return S.items.filter(function(it){ return occurs(it, d) && (!f || f === 'All' || it.space === f); })
    .sort(function(a, b){ var x = a.time || '99', y = b.time || '99'; return x < y ? -1 : x > y ? 1 : 0; });
}
function isDone(it, d){ return !!(it.doneOn && it.doneOn[d]); }
function hCount(h, d){ return (S.habitLog[d] && S.habitLog[d][h.id]) || 0; }
function hMet(h, d){ return hCount(h, d) >= (h.target || 1); }
function rDone(r, d){ return !!(S.routineLog[d] && S.routineLog[d][r.id]); }
function goalStats(g){ var n = g.steps.length, d = g.steps.filter(function(s){ return s.done; }).length; return { n: n, d: d, pct: g.achieved ? 100 : n ? Math.round(d / n * 100) : 0, complete: !!g.achieved || (n > 0 && d === n) }; }
function find(arr, id){ for (var i = 0; i < arr.length; i++) if (arr[i].id === id) return arr[i]; return null; }

/* ---------- period ---------- */
function periodInfo(){
  var days = S.period.days.slice().sort(), set = {};
  days.forEach(function(d){ set[d] = 1; });
  var starts = days.filter(function(d){ return !set[addDays(d, -1)]; });
  if (!starts.length) return { set: set, pred: {}, starts: [] };
  var gaps = [], lens = [];
  for (var i = 1; i < starts.length; i++){ var g = diffDays(starts[i - 1], starts[i]); if (g >= 15 && g <= 60) gaps.push(g); }
  starts.forEach(function(s){ var n = 0, d = s; while (set[d]){ n++; d = addDays(d, 1); } lens.push(n); });
  var lastGaps = gaps.slice(-6), lastLens = lens.slice(-6);
  var cycle = lastGaps.length ? Math.round(lastGaps.reduce(function(a, b){ return a + b; }, 0) / lastGaps.length) : 28;
  var len = Math.max(3, Math.min(8, Math.round(lastLens.reduce(function(a, b){ return a + b; }, 0) / lastLens.length)));
  var last = starts[starts.length - 1], next = addDays(last, cycle), pred = {};
  for (var k = 0; k < 3; k++){ var st = addDays(last, cycle * (k + 1)); for (var j = 0; j < len; j++) pred[addDays(st, j)] = 1; }
  return { set: set, pred: pred, starts: starts, cycle: cycle, len: len, last: last, next: next };
}
function periodLine(pi, d){
  if (!pi.starts.length) return 'Tap "Period day" on the days you have your period. Predictions start after the first one.';
  if (pi.set[d]){ var s = d; while (pi.set[addDays(s, -1)]) s = addDays(s, -1); return 'Period day ' + (diffDays(s, d) + 1) + '. Average cycle ' + pi.cycle + ' days.'; }
  var n = diffDays(today(), pi.next);
  if (n > 0) return 'Next period around ' + fmtShort(pi.next) + ' (in ' + n + (n === 1 ? ' day' : ' days') + '). Average cycle ' + pi.cycle + ' days.';
  if (n === 0) return 'Period expected today (' + fmtShort(pi.next) + ').';
  return 'Period expected ' + fmtShort(pi.next) + ', ' + (-n) + (n === -1 ? ' day' : ' days') + ' ago. Log it when it starts.';
}

var idb = null;
function mdb(){ return new Promise(function(res, rej){ if (idb) return res(idb); try { var rq = indexedDB.open('harian-media', 1); rq.onupgradeneeded = function(){ rq.result.createObjectStore('m'); }; rq.onsuccess = function(){ idb = rq.result; res(idb); }; rq.onerror = function(){ rej(rq.error); }; } catch (e) { rej(e); } }); }
function mTx(mode, fn){ return mdb().then(function(d){ return new Promise(function(res, rej){ var tx = d.transaction('m', mode), out; var r = fn(tx.objectStore('m')); if (r) r.onsuccess = function(){ out = r.result; }; tx.oncomplete = function(){ res(out); }; tx.onerror = tx.onabort = function(){ rej(tx.error); }; }); }); }
function mPut(id, blob){ return mTx('readwrite', function(st){ return st.put(blob, id); }); }
function mGet(id){ return mTx('readonly', function(st){ return st.get(id); }); }

function compressBlob(file, cb){
  var u = URL.createObjectURL(file), img = new Image();
  img.onload = function(){ var k = Math.min(1, 1280 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(u); if (c.toBlob) c.toBlob(function(b){ cb(b); }, 'image/jpeg', 0.78); else cb(null); };
  img.onerror = function(){ URL.revokeObjectURL(u); cb(null); };
  img.src = u;
}

function vTracker(){
  var t = today(), parts = [head(MON[new Date().getMonth()] + ' ' + new Date().getFullYear(), 'Habits', '<button class="fab" data-a="new-habit" aria-label="New habit">' + PLUS + '</button>', true)];
  if (!S.habits.length){
    parts.push('<div class="empty glass">Track habits like drinking water or reading. Your streaks and monthly map appear here.<button class="btn btn-chrome" data-a="new-habit">Add your first habit</button></div>');
  } else {
    if (!find(S.habits, ui.th)) ui.th = S.habits[0].id;
    var h = find(S.habits, ui.th);
    parts.push('<div class="chips" role="group" aria-label="Habit">' + S.habits.map(function(x){ return '<button class="chip" data-a="th" data-v="' + x.id + '" aria-pressed="' + (x.id === h.id) + '">' + dot(x.space) + esc(x.name) + '</button>'; }).join('') + '</div>');
    var d = hMet(h, t) ? t : addDays(t, -1), streak = 0, guard = 0;
    while (hMet(h, d) && guard < 3660){ streak++; d = addDays(d, -1); guard++; }
    var startD = h.created && h.created < t ? h.created : addDays(t, -60), best = 0, run = 0;
    if (startD < addDays(t, -400)) startD = addDays(t, -400);
    for (d = startD; d <= t; d = addDays(d, 1)){ run = hMet(h, d) ? run + 1 : 0; if (run > best) best = run; }
    var now = new Date(), y = now.getFullYear(), m = now.getMonth(), off = new Date(y, m, 1).getDay(), days = new Date(y, m + 1, 0).getDate();
    var metDays = 0, cells = 'SMTWTFS'.split('').map(function(l){ return '<span class="cal-h" aria-hidden="true">' + l + '</span>'; }).join('');
    for (var i = 0; i < off; i++) cells += '<span></span>';
    for (var k = 1; k <= days; k++){
      var dd = ymd(new Date(y, m, k));
      if (dd > t){ cells += '<span class="hc fut" aria-label="' + fmtShort(dd) + ', upcoming">' + k + '</span>'; continue; }
      var r = hCount(h, dd) / (h.target || 1), lv = r <= 0 ? 0 : r < .5 ? 1 : r < 1 ? 2 : 3;
      if (lv === 3) metDays++;
      cells += '<span class="hc l' + lv + (dd === t ? ' tod' : '') + '" role="img" aria-label="' + fmtShort(dd) + ', ' + ['not done', 'started', 'almost', 'done'][lv] + '">' + k + '</span>';
    }
    parts.push('<section class="deep" style="flex-direction:row;align-items:center;gap:14px" aria-label="Streak"><div style="position:relative;width:62px;height:62px;flex-shrink:0;display:flex;align-items:center;justify-content:center"><svg width="62" height="62" viewBox="0 0 24 24" aria-hidden="true" style="position:absolute;inset:0"><path d="' + STAR + '" fill="url(#g-star)"/></svg><span style="position:relative;font-family:var(--display);font-weight:800;font-size:16px;color:#4A1230">' + streak + '</span></div>' +
      '<div style="flex:1;display:flex;flex-direction:column;gap:3px"><span class="label">Current streak</span><span class="deep-title">' + streak + (streak === 1 ? ' day' : ' days') + ' of ' + esc(h.name.toLowerCase()) + '</span><span class="sub">Best ' + best + ' · done ' + metDays + ' days this month · goal ' + (h.target || 1) + '/day</span></div></section>');
    parts.push('<section class="heat glass" aria-label="This month"><div class="sec-h"><span class="label">▸ This month ◂</span><span class="legend">Less <i style="background:var(--heat0);border:1px solid var(--line)"></i><i style="background:var(--heat1)"></i><i style="background:var(--heat2)"></i><i style="background:var(--chrome)"></i> More</span></div><div class="heat-g">' + cells + '</div></section>');
  }
  var bars = '', labels = '', sum = 0, cnt = 0;
  for (var j = 6; j >= 0; j--){
    var md = addDays(t, -j), mv = S.journal[md] && S.journal[md].mood;
    if (mv){ sum += mv; cnt++; }
    bars += '<span class="mb">' + (mv || '') + '<span class="' + (mv ? '' : 'none') + '" style="' + (mv ? 'height:' + (mv * 14) + 'px' : '') + '"></span></span>';
    labels += '<span class="' + (j === 0 ? 't' : '') + '">' + 'SMTWTFS'[parseYmd(md).getDay()] + '</span>';
  }
  parts.push('<section class="card glass" aria-label="Mood"><div class="sec-h"><span class="label">▸ Mood · last 7 days ◂</span><span style="font-size:12px;font-weight:700;color:var(--accent)">' + (cnt ? 'avg ' + (sum / cnt).toFixed(1) + ' / 5' : 'no entries yet') + '</span></div><div class="moodbars">' + bars + '</div><div class="days">' + labels + '</div>' + (cnt ? '' : '<p class="hint">Pick a heart in the evening wrap or the journal to log your mood.</p>') + '</section>');
  var ws = addDays(t, -parseYmd(t).getDay()), counts = {}, total = 0;
  SPACES.forEach(function(s){ counts[s] = 0; });
  for (var w = 0; w < 7; w++) itemsOn(addDays(ws, w)).forEach(function(it){ counts[it.space]++; total++; });
  if (total){
    var low = SPACES.filter(function(s){ return counts[s] / total < .12; })[0];
    parts.push('<section class="card glass" aria-label="Life balance"><span class="label">▸ Life balance · this week ◂</span><div class="bal" role="img" aria-label="' + SPACES.map(function(s){ return s + ' ' + Math.round(counts[s] / total * 100) + ' percent'; }).join(', ') + '">' +
      SPACES.map(function(s){ return counts[s] ? '<span style="width:' + (counts[s] / total * 100) + '%;background:' + sc(s) + '"></span>' : ''; }).join('') + '</div>' +
      '<div class="bal-l">' + SPACES.map(function(s){ return '<div>' + dot(s) + s + '<strong>' + Math.round(counts[s] / total * 100) + '%</strong></div>'; }).join('') + '</div>' +
      (low && total >= 4 ? '<p class="hint">' + low + ' time is low this week. Maybe plan something? ♡</p>' : '') + '</section>');
  }
  if (S.habits.length) parts.push('<button class="btn btn-ghost" data-a="habits">Manage habits</button>');
  return parts.join('');
}

/* ---------- health ---------- */
function sortedWeights(){ return S.health.weights.slice().sort(function(a, b){ return a.date < b.date ? -1 : a.date > b.date ? 1 : 0; }); }
function bmiOf(kg){ var h = S.health.height / 100; return h ? kg / (h * h) : 0; }
function bmiCat(b){ if (b < 18.5) return ['Underweight', 'k2']; if (b < 23) return ['Normal', 'k7']; if (b < 27.5) return ['Overweight', 'k3']; return ['Obese', 'k6']; }
function kgDiff(n){ var r = Math.round(n * 10) / 10; return (r > 0 ? '+' : '') + r.toFixed(1) + ' kg'; }
function weightChart(ws){
  var pts = ws.slice(-30); if (pts.length < 2) return '';
  var W = 320, H = 150, pl = 36, pr = 12, pt = 12, pb = 26;
  var ys = pts.map(function(p){ return p.kg; }), mn = Math.floor(Math.min.apply(null, ys) - 1), mx = Math.ceil(Math.max.apply(null, ys) + 1);
  var d0 = pts[0].date, span = Math.max(1, diffDays(d0, pts[pts.length - 1].date));
  function X(d){ return pl + diffDays(d0, d) / span * (W - pl - pr); }
  function Y(v){ return pt + (mx - v) / (mx - mn) * (H - pt - pb); }
  var grid = [mn, (mn + mx) / 2, mx].map(function(v){ return '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + Y(v).toFixed(1) + '" y2="' + Y(v).toFixed(1) + '" style="stroke:var(--line)" stroke-width="1"/><text x="' + (pl - 6) + '" y="' + (Y(v) + 4).toFixed(1) + '" text-anchor="end" font-size="10" style="fill:var(--muted)">' + (Math.round(v * 10) / 10) + '</text>'; }).join('');
  var line = pts.map(function(p, i){ return (i ? 'L' : 'M') + X(p.date).toFixed(1) + ' ' + Y(p.kg).toFixed(1); }).join(' ');
  var area = line + ' L' + X(pts[pts.length - 1].date).toFixed(1) + ' ' + (H - pb) + ' L' + X(d0).toFixed(1) + ' ' + (H - pb) + ' Z';
  var dots = pts.map(function(p, i){ var last = i === pts.length - 1; return '<circle cx="' + X(p.date).toFixed(1) + '" cy="' + Y(p.kg).toFixed(1) + '" r="' + (last ? 5 : 3) + '" style="fill:' + (last ? 'var(--accent)' : 'var(--sheet)') + ';stroke:var(--accent)" stroke-width="2"/>'; }).join('');
  var lp = pts[pts.length - 1];
  return '<section class="card glass" aria-label="Weight trend"><div class="sec-h"><span class="label">▸ Weight trend ◂</span><span class="hint">last ' + pts.length + ' entries</span></div>' +
    '<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="Weight from ' + pts[0].kg + ' kg on ' + fmtShort(d0) + ' to ' + lp.kg + ' kg on ' + fmtShort(lp.date) + '">' + grid +
    '<path d="' + area + '" style="fill:var(--accent)" fill-opacity=".12"/><path d="' + line + '" fill="none" style="stroke:var(--accent)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>' + dots +
    '<text x="' + pl + '" y="' + (H - 6) + '" font-size="10" style="fill:var(--muted)">' + fmtShort(d0) + '</text><text x="' + (W - pr) + '" y="' + (H - 6) + '" text-anchor="end" font-size="10" style="fill:var(--muted)">' + fmtShort(lp.date) + '</text></svg></section>';
}

  var pos = Math.max(1, Math.min(99, (b - 15) / 20 * 100));

    '<div class="bmi-ticks" aria-hidden="true"><span style="left:17.5%">18.5</span><span style="left:40%">23</span><span style="left:62.5%">27.5</span></div>' +
    '<div class="stats"><div class="stat"><b>' + last.kg.toFixed(1) + ' kg</b><span>latest weight</span></div><div class="stat"><b>' + (prev ? kgDiff(last.kg - prev.kg) : '–') + '</b><span>since last entry</span></div></div>' +
    (ws.length > 2 ? '<span class="sub">' + kgDiff(last.kg - first.kg) + ' since ' + fmtShort(first.date) + '.</span>' : '') + '</section>';
  out += hRow + weightChart(ws);

  }).join('') + '</div></section>';
  out += '<p class="hint">BMI is a rough guide and does not account for muscle or body shape. Categories follow the Malaysian Ministry of Health cut-offs for Asian adults: normal 18.5–22.9, overweight 23–27.4, obese 27.5 and above.</p>';
  return out;
}

var SPACE_WORDS = { work: 'Work', kerja: 'Work', family: 'Family', keluarga: 'Family', personal: 'Personal', peribadi: 'Personal', me: 'Personal', friends: 'Friends', friend: 'Friends', kawan: 'Friends' };
function parseCapture(text, base){
  var t = today(), date = base || t, time = '', space = ui.filter !== 'All' ? ui.filter : 'Personal', s = ' ' + text + ' ', m;
  s = s.replace(/#(\w+)/g, function(all, w){ var k = SPACE_WORDS[w.toLowerCase()]; if (k){ space = k; return ' '; } return all; });
  s = s.replace(/\s(tomorrow|tmr|tmrw|esok)\s/i, function(){ date = addDays(t, 1); return ' '; });
  s = s.replace(/\s(today|hari ini)\s/i, function(){ date = t; return ' '; });
  var dn = ['sun','mon','tue','wed','thu','fri','sat'];
  s = s.replace(/\s(?:on\s)?(sun|mon|tue|tues|wed|thu|thur|thurs|fri|sat)(?:day|nesday|rsday|urday|sday)?\s/i, function(all, w){
    var want = dn.indexOf(w.toLowerCase().slice(0, 3)), cur = parseYmd(t).getDay(), diff = (want - cur + 7) % 7;
    date = addDays(t, diff === 0 ? 7 : diff); return ' ';
  });
  m = s.match(/\s(?:at\s)?(\d{1,2})(?::(\d{2}))?\s?(am|pm)\s/i);
  if (m){ var h = +m[1] % 12 + (m[3].toLowerCase() === 'pm' ? 12 : 0); if (h < 24){ time = pad(h) + ':' + (m[2] || '00'); s = s.replace(m[0], ' '); } }
  else { m = s.match(/\s(?:at\s)?([01]?\d|2[0-3]):([0-5]\d)\s/); if (m){ time = pad(+m[1]) + ':' + m[2]; s = s.replace(m[0], ' '); } }
  return { title: s.replace(/\s+/g, ' ').trim(), date: date, time: time, space: space };
}
function addFromCapture(raw, base){
  var p = parseCapture(raw, base); if (!p.title){ toast('Add a few words first'); return false; }
  S.items.push({ id: uid(), title: p.title, date: p.date, time: p.time, space: p.space, repeat: 'none', doneOn: {} });
  save(); render();
  toast('Added · ' + p.space + ' · ' + relDay(p.date) + (p.time ? ' ' + fmtTime(p.time) : ''));
  return true;
}

function compress(file, cb){
  var r = new FileReader();
  r.onload = function(){
    var img = new Image();
    img.onload = function(){
      var max = 900, w = img.width, h = img.height, k = Math.min(1, max / Math.max(w, h));
      var c = document.createElement('canvas'); c.width = Math.round(w * k); c.height = Math.round(h * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      cb(c.toDataURL('image/jpeg', 0.72));
    };
    img.onerror = function(){ cb(null); };
    img.src = r.result;
  };
  r.onerror = function(){ cb(null); };
  r.readAsDataURL(file);
}

  if (e.target.id === 'attPhotoIn' || e.target.id === 'attVideoIn'){
    var mf = e.target.files && e.target.files[0], isVid = e.target.id === 'attVideoIn';
    if (!mf || !ui.sheet || ui.sheet.kind !== 'routine') return;
    if (isVid && mf.size > 80 * 1024 * 1024){ toast('That video is over 80 MB. Use a shorter clip, or attach it as a link instead.'); return; }
    var mid = uid(), sheetRef = ui.sheet;
    toast(isVid ? 'Adding video…' : 'Adding photo…');
    var store = function(blob){
      if (!blob){ toast('That file could not be read. Try another one.'); return; }
      mPut(mid, blob).then(function(){
        if (ui.sheet !== sheetRef){ mDel(mid); return; }
        sheetRef.att.push({ id: mid, type: isVid ? 'video' : 'image', title: isVid ? (mf.name || '').replace(/\.[^.]+$/, '').slice(0, 40) : '' });
        refreshAtt(); toast(isVid ? 'Video attached' : 'Photo attached');
      }, function(){ toast('Not enough space on this phone to save it. Try a link instead.'); });
    };
    if (isVid) store(mf); else compressBlob(mf, store);
    return;
  }
  if (e.target.id === 'photoIn'){
    var file = e.target.files && e.target.files[0], g = find(S.goals, ui.photoGoal); if (!file || !g) return;
    toast('Adding photo…');
    compress(file, function(data){
      if (!data){ toast('That photo could not be read. Try another one.'); return; }
      var id = uid();
      if (!setPhoto(id, data)){ toast('Phone storage for Harian is full. Delete an older photo first.'); return; }
      g.photos.push({ id: id, date: today(), caption: '' });
      if (!save()){ g.photos.pop(); delPhoto(id); return; }
      ui.open[g.id] = true; render(); toast('Progress photo added ✦');
    });
    return;
  }
  if (e.target.id !== 'f_import') return;
  var file2 = e.target.files && e.target.files[0]; if (!file2) return;
  var r = new FileReader();
  r.onload = function(){
    try {
      var o = JSON.parse(r.result); if (!o || !Array.isArray(o.items)) throw 0;
      var ph = o.photos || {}; delete o.photos;
      Object.keys(ph).forEach(function(k){ setPhoto(k, ph[k]); });
      S = normalize(o); save(); closeSheet(); render(); toast('Backup restored');
    } catch (x) { toast('That file is not a Harian backup'); }
  };
  r.readAsText(file2);
});
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') A.close(); });

function route(){
  var h = location.hash.replace('#', '');
  ui.tab = views[h] ? h : 'today';
  if (S){ render(); document.getElementById('screen').scrollTop = 0; }
}
window.addEventListener('hashchange', route);
setInterval(function(){ if (S && !ui.sheet && document.activeElement && document.activeElement.tagName !== 'INPUT') render(); }, 60000);

var loaded = load();
S = loaded ? normalize(loaded) : null;
if (S && loaded.v !== 2){ S.v = 2; save(); }
renderBanner();
route();
if (!S){ renderTabs(); openSheet({ kind: 'welcome' }); }
nativeInit();
})();
</script>
