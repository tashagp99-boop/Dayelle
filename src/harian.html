<title>Dayelle</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500;600;700&family=Unbounded:wght@600;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Silkscreen&display=swap">
<style>
/* Layout: one phone-width column; editorial serif headings over calm cream cards; a raised + button in the middle of the tab bar. */
:root{
  --bg1:#F7F1E8;--bg2:#F3EBDF;--bg3:#EFE5D8;--bg4:#F7F1E8;
  --ink:#3B2B24;--muted:#735A4B;--faint:#80675A;
  --glass:rgba(255,253,249,.82);--glass-strong:#FFFDF9;--edge:rgba(232,220,207,.95);--line:#E8DCCF;
  --shadow:rgba(59,43,36,.07);--sheet:#FBF7F1;--scrim:rgba(59,43,36,.38);
  --accent:#8A6B52;--soft:#D8B7B0;--danger:#A3392F;--period:#B5576B;

  --work:#5F73A0;--family:#B0606F;--personal:#8A6B52;--friends:#5E8068;
  --k1:#B0606F;--k2:#5F73A0;--k3:#A87434;--k4:#86659A;--k5:#4F8072;--k6:#BE5C5C;--k7:#62804A;--k8:#7E6F65;
  --heat0:#FFFDF9;--heat1:#EAD9C9;--heat2:#CBA88C;
  --title:linear-gradient(#3B2B24,#3B2B24);--title-glow:transparent;
  --chrome:linear-gradient(150deg,#A88A72 0%,#8A6B52 100%);--chrome-edge:transparent;--on-chrome:#FFFFFF;
  --chip-on:#3B2B24;--chip-on-ink:#F7F1E8;--chip-on-edge:#3B2B24;
  --bar:linear-gradient(90deg,#D8B7B0 0%,#8A6B52 100%);
  --rib-op:0;
  --display:'Cormorant Garamond',Georgia,'Times New Roman',serif;--display-w:600;--title-size:34px;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --label-font:'DM Sans',system-ui,sans-serif;--label-ls:.14em;--label-size:10.5px;
  --radius:20px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg1:#16110E;--bg2:#1C1512;--bg3:#191310;--bg4:#16110E;
  --ink:#F2E8DC;--muted:#C8B4A2;--faint:#B09A87;
  --glass:rgba(255,240,225,.06);--glass-strong:#241B16;--edge:rgba(255,235,215,.12);--line:#3A2D25;

  --work:#A3B3D8;--family:#E2A5B2;--personal:#D9B697;--friends:#A6C4AC;
  --k1:#E2A5B2;--k2:#A3B3D8;--k3:#E0B07A;--k4:#C3A6D6;--k5:#8CC4B4;--k6:#EE9A9A;--k7:#A8C78E;--k8:#C2B4AA;
  --heat0:#241B16;--heat1:#4A382D;--heat2:#8A6B52;
  --title:linear-gradient(#F2E8DC,#F2E8DC);
  --chrome:linear-gradient(150deg,#E6C9AE 0%,#C9A381 100%);--on-chrome:#1C1512;
  --chip-on:#F2E8DC;--chip-on-ink:#1C1512;--chip-on-edge:#F2E8DC;
  --bar:linear-gradient(90deg,#8A6B52 0%,#D9B697 100%);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg1:#16110E;--bg2:#1C1512;--bg3:#191310;--bg4:#16110E;
  --ink:#F2E8DC;--muted:#C8B4A2;--faint:#B09A87;
  --glass:rgba(255,240,225,.06);--glass-strong:#241B16;--edge:rgba(255,235,215,.12);--line:#3A2D25;
  --shadow:rgba(0,0,0,.4);--sheet:#1F1813;--scrim:rgba(0,0,0,.6);
  --accent:#D9B697;--soft:#D8B7B0;--danger:#F08A80;--period:#E38AA0;
  --deep1:#2B201A;--deep2:#3A2C24;--deep-ink:#F7F1E8;--deep-muted:#D9C7B6;--deep-label:#E3C6BF;--deep-glow:rgba(216,183,176,.12);
  --work:#A3B3D8;--family:#E2A5B2;--personal:#D9B697;--friends:#A6C4AC;
  --k1:#E2A5B2;--k2:#A3B3D8;--k3:#E0B07A;--k4:#C3A6D6;--k5:#8CC4B4;--k6:#EE9A9A;--k7:#A8C78E;--k8:#C2B4AA;
  --heat0:#241B16;--heat1:#4A382D;--heat2:#8A6B52;
  --title:linear-gradient(#F2E8DC,#F2E8DC);
  --chrome:linear-gradient(150deg,#E6C9AE 0%,#C9A381 100%);--on-chrome:#1C1512;
  --chip-on:#F2E8DC;--chip-on-ink:#1C1512;--chip-on-edge:#F2E8DC;
  --bar:linear-gradient(90deg,#8A6B52 0%,#D9B697 100%);
  color-scheme:dark}
:root[data-skin="minimal"]{
  --bg1:#FFFFFF;--bg2:#FAFAFA;--bg3:#F6F6F6;--bg4:#FFFFFF;
  --ink:#1F1F1F;--muted:#5C5C5C;--faint:#6B6B6B;
  --glass:rgba(255,255,255,.92);--glass-strong:#FFFFFF;--edge:#ECECEC;--line:#E4E4E4;
  --shadow:rgba(0,0,0,.05);--sheet:#FFFFFF;--scrim:rgba(0,0,0,.35);
  --accent:#2F2F2F;--soft:#BDBDBD;
  --deep1:#1F1F1F;--deep2:#2E2E2E;--deep-ink:#FFFFFF;--deep-muted:#D6D6D6;--deep-label:#C9C9C9;--deep-glow:rgba(255,255,255,.06);
  --work:#566890;--family:#99586A;--personal:#5C5C5C;--friends:#557461;
  --heat0:#FFFFFF;--heat1:#E3E3E3;--heat2:#9E9E9E;
  --title:linear-gradient(#1F1F1F,#1F1F1F);
  --chrome:linear-gradient(150deg,#4A4A4A,#2F2F2F);--on-chrome:#FFFFFF;
  --chip-on:#1F1F1F;--chip-on-ink:#FFFFFF;--chip-on-edge:#1F1F1F;
  --bar:linear-gradient(90deg,#BDBDBD,#2F2F2F);color-scheme:light}
:root[data-skin="nature"]{
  --bg1:#F2F0E6;--bg2:#ECEBDD;--bg3:#E7E6D5;--bg4:#F2F0E6;
  --ink:#2E3A2C;--muted:#55644E;--faint:#606E59;
  --glass:rgba(255,255,248,.8);--glass-strong:#FBFBF4;--edge:rgba(218,220,198,.95);--line:#DADCC6;
  --shadow:rgba(46,58,44,.07);--sheet:#F8F7EE;--scrim:rgba(46,58,44,.38);
  --accent:#55703F;--soft:#B9A47E;
  --deep1:#2E3A2C;--deep2:#3D4B38;--deep-ink:#F2F0E6;--deep-muted:#DCE0CC;--deep-label:#D5C9A8;--deep-glow:rgba(185,164,126,.2);
  --work:#5A7194;--family:#A5636A;--personal:#55703F;--friends:#8A6B3F;
  --heat0:#FBFBF4;--heat1:#DCE3C8;--heat2:#9DB283;
  --title:linear-gradient(#2E3A2C,#2E3A2C);
  --chrome:linear-gradient(150deg,#7E9A6A,#55703F);--on-chrome:#FFFFFF;
  --chip-on:#2E3A2C;--chip-on-ink:#F2F0E6;--chip-on-edge:#2E3A2C;
  --bar:linear-gradient(90deg,#B9A47E,#55703F);color-scheme:light}
:root[data-skin="chrome"]{
  --bg1:#FBEAF2;--bg2:#F4D2E2;--bg3:#ECE3EC;--bg4:#F9E6EF;
  --ink:#3A1F2C;--muted:#6E3A55;--faint:#7A5868;
  --glass:rgba(255,255,255,.62);--glass-strong:rgba(255,255,255,.85);--edge:rgba(255,255,255,.95);--line:#E6CBD8;
  --shadow:rgba(156,35,99,.12);--sheet:#FFF5F9;--scrim:rgba(58,20,40,.38);
  --accent:#9C2363;--soft:#F59AC4;--danger:#B3261E;--period:#D6336C;
  --deep1:#2B1222;--deep2:#4E1A3A;--deep-ink:#FFFFFF;--deep-muted:#F6CFE1;--deep-label:#FFC2DE;--deep-glow:rgba(255,120,190,.55);
  --work:#4F5BB8;--family:#C2307A;--personal:#8A3FC0;--friends:#5E5866;
  --k1:#C2307A;--k2:#4F5BB8;--k3:#B35C00;--k4:#8A3FC0;--k5:#1F7A6D;--k6:#D6336C;--k7:#2E7D32;--k8:#5E5866;
  --heat0:rgba(255,255,255,.9);--heat1:#F8C9DD;--heat2:#EC8FBA;
  --title:linear-gradient(180deg,#C64A8A 0%,#5E1239 46%,#9C2363 56%,#D86FA3 100%);--title-glow:#FFFFFF;
  --chrome:linear-gradient(150deg,#FFC7E0 0%,#E0559A 45%,#9C2363 100%);--chrome-edge:#FFFFFF;--on-chrome:#FFFFFF;
  --chip-on:linear-gradient(180deg,#FFE6F1 0%,#F59AC4 45%,#E679AE 55%,#FFD6E8 100%);--chip-on-ink:#4A1230;--chip-on-edge:#FFFFFF;
  --bar:linear-gradient(90deg,#FFC7E0 0%,#E0559A 55%,#9C2363 100%);
  --rib-op:.5;
  --display:'Unbounded',ui-rounded,system-ui,sans-serif;--display-w:800;--title-size:28px;
  --body:'Plus Jakarta Sans',system-ui,-apple-system,sans-serif;
  --label-font:'Silkscreen',ui-monospace,monospace;--label-ls:.06em;--label-size:11px;
  color-scheme:light}

html,body{height:100%}
body{background:linear-gradient(170deg,var(--bg1) 0%,var(--bg2) 38%,var(--bg3) 68%,var(--bg4) 100%);color:var(--ink);font-family:var(--body);font-size:15px;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
a{color:var(--accent);text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{position:relative;height:100%;max-width:520px;margin:0 auto;display:flex;flex-direction:column;overflow:hidden}
.decor{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:0;display:none}
:root[data-skin="chrome"] .decor,:root[data-skin="chrome"] .hdeco{display:block}
.hdeco{display:none}
.screen{position:relative;z-index:1;flex:1;min-height:0;overflow-y:auto;padding-block:20px 24px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.banner{position:relative;z-index:2;margin:10px 18px 0;padding:10px 12px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line);font-size:13px}

.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;position:relative}
.eyebrow,.label{font-family:var(--label-font);font-size:var(--label-size);letter-spacing:var(--label-ls);color:var(--muted);text-transform:uppercase;font-weight:600}
.eyebrow{font-size:calc(var(--label-size) + 1px)}
.h-greet{margin:6px 0 0;font-family:var(--display);font-size:24px;font-weight:500;line-height:1.1;text-wrap:balance}
.h-title{display:inline-block;font-family:var(--display);font-size:var(--title-size);font-weight:var(--display-w);line-height:1.05;background:var(--title);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 1px 0 var(--title-glow))}
.serif{font-family:var(--display);font-weight:var(--display-w)}
.head-r{display:flex;align-items:center;gap:8px}
.back{display:inline-flex;align-items:center;gap:4px;min-height:36px;font-size:13px;font-weight:600;color:var(--accent)}
.icon-btn{width:44px;height:44px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:var(--glass);border:1px solid var(--edge);color:var(--muted);flex-shrink:0}
.fab{width:46px;height:46px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:var(--chrome);border:1px solid var(--chrome-edge);box-shadow:0 4px 12px var(--shadow);color:var(--on-chrome);flex-shrink:0}

.glass{background:var(--glass);border:1px solid var(--edge);box-shadow:0 6px 18px var(--shadow);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.deep{border-radius:var(--radius);padding:16px 18px;color:var(--deep-ink);background:radial-gradient(circle at 90% 0%,var(--deep-glow) 0%,transparent 55%),linear-gradient(150deg,var(--deep1) 0%,var(--deep2) 60%,var(--deep1) 100%);box-shadow:0 10px 26px var(--shadow);display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.deep .label{color:var(--deep-label)}
.deep .sub{font-size:12px;color:var(--deep-muted)}
.deep-title{font-family:var(--display);font-size:21px;font-weight:var(--display-w);line-height:1.2}
:root[data-skin="chrome"] .deep-title{font-family:var(--body);font-size:16px;font-weight:700}
.deep .link{color:var(--deep-label)}
.deep-row{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:flex;flex-direction:column;gap:2px}
.stat b{font-family:var(--display);font-size:20px;font-weight:var(--display-w);font-variant-numeric:tabular-nums}
.stat span{font-size:11px;color:var(--deep-muted)}
.mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;font-size:13px}
.mini li{display:flex;gap:8px;align-items:baseline}
.mini time{font-size:11px;color:var(--deep-muted);min-width:58px}
.wrap-in{display:flex;gap:8px;align-items:center;height:46px;padding:0 6px 0 14px;border-radius:99px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.22)}
.wrap-in input{flex:1;min-width:0;border:none;outline:none;background:transparent;color:var(--deep-ink);font-size:16px}
.wrap-in input::placeholder{color:var(--deep-muted)}
.wrap-in .fab{width:36px;height:36px}
.btn-light{min-height:40px;padding:0 14px;border-radius:99px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.25);color:var(--deep-ink);font-size:13px;font-weight:600}

.week{display:flex;justify-content:space-between;padding:6px 4px;border-radius:var(--radius)}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;width:44px;padding:2px 0}
.wd-l{font-size:11px;font-weight:600;color:var(--muted)}
.wd-n{width:32px;height:32px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:14px}
.wd.is-today .wd-n{background:var(--chrome);color:var(--on-chrome);border:1.5px solid var(--chrome-edge)}
.wd-dot{width:5px;height:5px;border-radius:99px}
.wd-dot.on{background:var(--accent)}

.chips{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:2px 18px 4px;scrollbar-width:none}
.chip{display:flex;align-items:center;gap:6px;flex-shrink:0;height:36px;padding:0 14px;border-radius:99px;font-size:13px;font-weight:600;background:var(--glass);border:1px solid var(--edge);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on-edge)}
.dot{display:inline-block;border-radius:99px;background:var(--c);flex-shrink:0}
.seg2{display:flex;padding:4px;border-radius:14px}
.seg2 a,.seg2 button{flex:1;height:38px;border-radius:11px;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;color:var(--ink)}
.seg2 [aria-selected="true"],.seg2 [aria-current="page"]{background:var(--chip-on);color:var(--chip-on-ink)}

.sec{display:flex;flex-direction:column;gap:8px}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.link{font-size:13px;font-weight:600;color:var(--accent);min-height:32px;display:inline-flex;align-items:center;gap:4px}
.habits{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.hab{flex:0 0 84px;min-height:86px;display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:18px}
.hab-ring{width:34px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;border:3px solid var(--c);color:var(--c);background:var(--glass-strong)}
.hab.met .hab-ring{background:var(--chrome);border:1.5px solid var(--chrome-edge);color:var(--on-chrome)}
.hab-n{font-size:11px;font-weight:600;line-height:1.25;text-align:center}

.routine{border-radius:var(--radius);padding:6px 14px}
.rt-part{padding:8px 0 2px}
.rt-row{display:flex;flex-wrap:wrap;align-items:center}
.rt-row .rt{flex:1;min-width:0}
.rt{display:flex;align-items:center;gap:12px;width:100%;min-height:44px;text-align:left;font-size:14px;font-weight:500}
.rt .box{width:24px;height:24px}
.rt.done span:last-child{color:var(--faint);text-decoration:line-through}
.atts{display:flex;flex-wrap:wrap;gap:6px;width:100%;padding:0 0 8px 36px}
.att{display:inline-flex;align-items:center;gap:5px;min-height:32px;max-width:100%;padding:0 10px;border-radius:99px;font-size:12px;font-weight:600;background:var(--glass-strong);border:1px solid var(--line);color:var(--accent)}
.att span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:160px}
.att-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--glass-strong);border:1px solid var(--line)}
.att-item .grow{flex:1;min-width:0;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px 10px 14px;border-radius:18px;width:100%;color:inherit;text-align:left}
.check{flex-shrink:0;width:30px;height:30px;border-radius:99px;display:flex;align-items:center;justify-content:center;border:2px solid var(--c);background:var(--glass-strong);color:var(--on-chrome)}
.check.on{background:var(--chrome);border:1.5px solid var(--chrome-edge)}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;min-height:44px;justify-content:center}
.row-title{font-size:15px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row-title.done{color:var(--faint);text-decoration:line-through}
.row-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.amt{font-family:var(--display);font-size:16px;font-weight:var(--display-w);font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{font-size:10px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent);color:var(--glass-strong);letter-spacing:.02em;white-space:nowrap}
.pill.ex{background:var(--glass-strong);color:var(--muted);border:1px solid var(--line)}
.empty{padding:20px 16px;border-radius:var(--radius);text-align:center;font-size:13px;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center;line-height:1.5}
.btn{min-height:44px;padding:0 18px;border-radius:99px;font-weight:600;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-chrome{background:var(--chip-on);color:var(--chip-on-ink);border:1px solid var(--chip-on-edge)}
.btn-ghost{background:var(--glass);border:1px solid var(--edge);color:var(--ink)}
.btn-danger{color:var(--danger);border:1px solid var(--danger);background:transparent}
.btn-danger.armed{background:var(--danger);color:#FFFFFF}
.box{flex-shrink:0;width:22px;height:22px;border-radius:7px;display:flex;align-items:center;justify-content:center;border:2px solid var(--accent);background:var(--glass-strong);color:var(--on-chrome)}
.box.on{background:var(--chrome);border:1.5px solid var(--chrome-edge)}

.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;display:block}
.bar>span{display:block;height:100%;border-radius:99px;background:var(--bar)}
.deep .bar{background:rgba(255,255,255,.16)}
.deep .bar>span{background:linear-gradient(90deg,#FFFFFF 0%,var(--deep-label) 100%)}

.dock{position:relative;z-index:2;padding:8px 18px}
.capture{display:flex;align-items:center;gap:8px;height:50px;padding:0 6px 0 16px;border-radius:99px;background:var(--glass-strong);border:1px solid var(--edge);box-shadow:0 6px 18px var(--shadow)}
.capture input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px}
.capture input::placeholder{color:var(--faint)}
.capture .fab{width:38px;height:38px}

.tabbar{position:relative;z-index:2;display:flex;justify-content:space-around;align-items:center;padding:4px 4px 8px;background:var(--glass-strong);border-top:1px solid var(--edge)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;min-height:52px;justify-content:center;font-size:11px;font-weight:500;color:var(--muted)}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab-create{width:54px;height:54px;margin-top:-22px;border-radius:99px;display:flex;align-items:center;justify-content:center;background:var(--chrome);color:var(--on-chrome);border:3px solid var(--glass-strong);box-shadow:0 8px 20px var(--shadow)}

.cal{border-radius:var(--radius);padding:10px 8px;display:flex;flex-direction:column;gap:4px}
.cal-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.cal-h{text-align:center;font-family:var(--label-font);font-size:11px;color:var(--muted);padding:2px 0;font-weight:600}
.cal-d{height:56px;display:flex;flex-direction:column;align-items:center;gap:2px;padding-top:3px}
.cal-n{width:34px;height:34px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:500;position:relative}
.cal-n .emo{position:absolute;right:-6px;top:-4px;font-size:12px}
.cal-d.is-sel .cal-n{border:2px solid var(--accent);background:var(--glass-strong);font-weight:700}
.cal-d.is-today .cal-n{background:var(--chrome);color:var(--on-chrome);border:1.5px solid var(--chrome-edge);font-weight:700}
.cal-dots{display:flex;gap:2px;height:5px}
.cal-dots .dot{width:5px;height:5px}
.pm{width:16px;height:4px;border-radius:99px}
.pm.on{background:var(--period)}
.pm.pred{border:1.5px dashed var(--period);height:5px}
.legend{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:11px;color:var(--muted)}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.search{display:flex;align-items:center;gap:10px;height:46px;padding:0 14px;border-radius:14px}
.search input{flex:1;min-width:0;border:none;outline:none;background:transparent;font-size:16px}
.search input::placeholder{color:var(--faint)}
.ngrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.note{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:18px;text-align:left;min-height:120px;min-width:0;color:inherit}
.note h3{margin:0;font-size:15px;font-weight:600;line-height:1.3;display:flex;justify-content:space-between;gap:6px}
.note p{margin:0;flex:1;font-size:12px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line;word-break:break-word}
.moods{display:flex;gap:8px;flex-wrap:wrap}
.mood{width:46px;height:46px;border-radius:14px;border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:24px;line-height:1;filter:grayscale(.6);opacity:.7}
.mood[aria-pressed="true"]{filter:none;opacity:1;background:rgba(255,255,255,.22);border-color:rgba(255,255,255,.6);transform:scale(1.06)}
.mood.light{border-color:var(--line);background:var(--glass-strong)}
.mood.light[aria-pressed="true"]{background:var(--glass-strong);border-color:var(--accent)}

/* journal */
.entry{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:var(--radius);text-align:left;color:inherit;width:100%}
.entry-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.entry h3{margin:0;font-family:var(--display);font-size:21px;font-weight:var(--display-w);line-height:1.2}
:root[data-skin="chrome"] .entry h3{font-family:var(--body);font-size:16px}
.entry p{margin:0;font-size:13px;line-height:1.55;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.hl{font-size:13px;font-style:italic;color:var(--ink);border-left:2px solid var(--soft);padding-left:10px}
.emo-big{font-size:22px;line-height:1}
.prose{font-size:15px;line-height:1.65}
.prose h3{font-family:var(--display);font-size:20px;margin:.6em 0 .2em}
.prose blockquote{margin:.4em 0;padding-left:12px;border-left:2px solid var(--soft);font-style:italic}
.editor{min-height:180px;padding:12px 14px;border-radius:14px;border:1px solid var(--line);background:var(--glass-strong);outline:none;font-size:16px;line-height:1.65}
.editor:empty::before{content:attr(data-ph);color:var(--faint)}
.editor:focus{border-color:var(--accent)}
.toolbar{display:flex;gap:6px;flex-wrap:wrap}
.toolbar button{min-width:40px;height:36px;padding:0 10px;border-radius:10px;border:1px solid var(--line);background:var(--glass-strong);font-size:14px;font-weight:700;color:var(--ink)}

/* memories */
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.mt{position:relative;display:block;aspect-ratio:1;border-radius:12px;overflow:hidden;background:var(--line);max-width:100%}
.mt img,.mt video{width:100%;height:100%;object-fit:cover;display:block;border:0}
.mt .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#FFFFFF;background:rgba(0,0,0,.18)}
.mt .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 6px 5px;font-size:10px;font-weight:600;color:#FFFFFF;background:linear-gradient(transparent,rgba(0,0,0,.55));overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mstrip{display:flex;gap:8px;overflow-x:auto;margin:0 -18px;padding:0 18px 4px;scrollbar-width:none}
.mstrip .mt{flex:0 0 96px;width:96px;height:96px}
.mstrip .ph-add{flex:0 0 96px;height:96px}
.month-h{font-family:var(--display);font-size:20px;font-weight:var(--display-w);margin-top:6px}
.ph-add{aspect-ratio:1;border-radius:12px;border:1.5px dashed var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);cursor:pointer;background:var(--glass)}
.big-ph,.media-v{width:100%;max-width:100%;border-radius:16px;display:block}
.media-v{max-height:62vh;background:#000}
.picked{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.picked span{aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line);display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--muted)}
.picked img{width:100%;height:100%;object-fit:cover}

/* hubs */
.hub{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:var(--radius);text-align:left;min-height:136px;min-width:0;color:inherit}
.tile-i{width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--chrome);color:var(--on-chrome);border:1px solid var(--chrome-edge)}
.tile b{font-family:var(--display);font-size:22px;font-weight:var(--display-w);line-height:1.1}
:root[data-skin="chrome"] .tile b{font-family:var(--body);font-size:16px}
.tile span{font-size:12px;color:var(--muted);line-height:1.4}
.soon{display:flex;flex-wrap:wrap;gap:6px}
.soon span{font-size:11px;font-weight:600;padding:5px 10px;border-radius:99px;border:1px dashed var(--line);color:var(--muted)}
.create-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.create-grid button{display:flex;align-items:center;gap:12px;min-height:64px;padding:12px 14px;border-radius:16px;background:var(--glass-strong);border:1px solid var(--line);text-align:left;font-size:14px;font-weight:600}
.create-grid button .tile-i{width:36px;height:36px;border-radius:12px;flex-shrink:0}

/* goals */
.goal{border-radius:var(--radius);display:flex;flex-direction:column;overflow:hidden}
.goal-cover{display:block;width:100%;aspect-ratio:16/9;max-width:100%;object-fit:cover;background:var(--heat1)}
.goal-body{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.goal-head{display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.goal-top{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%}
.goal-pct{font-family:var(--display);font-size:16px;font-weight:var(--display-w);color:var(--accent)}
.goal-t{font-family:var(--display);font-size:21px;font-weight:var(--display-w);line-height:1.2}
:root[data-skin="chrome"] .goal-t{font-family:var(--body);font-size:17px}
.goal-why{font-size:13px;color:var(--muted);line-height:1.45}
.steps{list-style:none;margin:0;padding:4px 0 0;border-top:1px solid var(--line);display:flex;flex-direction:column}
.step{display:flex;align-items:center;gap:10px;width:100%;min-height:44px;text-align:left}
.goal-foot{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:12px;overflow:hidden;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph time{position:absolute;left:4px;bottom:4px;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:rgba(0,0,0,.6);color:#FFFFFF}

/* tracker & charts */
.heat{border-radius:var(--radius);padding:12px;display:flex;flex-direction:column;gap:8px}
.heat-g{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.hc{height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:600}
.hc.l0{background:var(--heat0);border:1px solid var(--line);color:var(--faint)}
.hc.l1{background:var(--heat1);color:var(--ink)}
.hc.l2{background:var(--heat2);color:var(--ink)}
.hc.l3{background:var(--chrome);color:var(--on-chrome)}
.hc.fut{background:transparent;border:1px dashed var(--line);color:var(--faint)}
.hc.tod{outline:2px solid var(--accent);outline-offset:1px}
.hc.emo{font-size:20px;background:var(--glass-strong);border:1px solid var(--line)}
.moodbars{display:flex;align-items:flex-end;justify-content:space-between;height:100px;padding:0 4px}
.mb{display:flex;flex-direction:column;align-items:center;gap:4px;width:36px;font-size:14px}
.mb span{width:26px;border-radius:9px 9px 4px 4px;background:var(--bar)}
.mb span.none{background:transparent;border:1px dashed var(--line);height:8px}
.days{display:flex;justify-content:space-between;padding:0 4px}
.days span{width:36px;text-align:center;font-size:11px;font-weight:600;color:var(--muted)}
.days span.t{color:var(--accent);font-weight:800}
.bal{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--glass-strong)}
.bal span{height:100%}
.bal-l{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 12px}
.bal-l div{display:flex;align-items:center;gap:6px;font-size:12px;min-width:0}
.bal-l strong{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}
.card{border-radius:var(--radius);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.dist{display:grid;grid-template-columns:28px minmax(0,1fr) 28px;gap:8px;align-items:center;font-size:12px}
.big-amt{font-family:var(--display);font-size:36px;font-weight:var(--display-w);font-variant-numeric:tabular-nums;line-height:1.05}
.cat-row{display:grid;grid-template-columns:90px minmax(0,1fr) auto;gap:10px;align-items:center;font-size:12px}
.cat-row .bar>span{background:var(--c)}
.day-h{display:flex;justify-content:space-between;font-size:12px;font-weight:600;color:var(--muted);padding:4px 4px 0}
.song-st{display:inline-flex;align-items:center;min-height:32px;padding:0 10px;border-radius:99px;font-size:11px;font-weight:600;border:1px solid var(--line);background:var(--glass-strong);white-space:nowrap}
.song-st.learning{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on-edge)}
.song-st.learned{background:var(--chrome);color:var(--on-chrome);border-color:var(--chrome-edge)}
.song-note{font-size:12px;color:var(--muted);white-space:pre-line;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.bmi-scale{position:relative;display:flex;gap:2px;height:10px;margin-top:4px}
.bmi-scale span{height:100%}
.bmi-scale span:first-child{border-radius:99px 0 0 99px}
.bmi-scale span:nth-child(4){border-radius:0 99px 99px 0}
.bmi-scale i{position:absolute;top:-6px;width:6px;height:22px;border-radius:3px;background:#FFFFFF;transform:translateX(-50%);box-shadow:0 0 0 2px var(--deep2),0 2px 6px rgba(0,0,0,.4)}
.bmi-ticks{position:relative;height:14px;font-size:10px;font-weight:700;color:var(--deep-muted)}
.bmi-ticks span{position:absolute;transform:translateX(-50%)}
.skins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.skin{position:relative}
.skin input{position:absolute;opacity:0;inset:0;margin:0}
.skin span{display:flex;flex-direction:column;gap:6px;padding:8px;border-radius:12px;border:1px solid var(--line);background:var(--glass-strong);font-size:12px;font-weight:600}
.skin i{display:block;height:26px;border-radius:8px;border:1px solid rgba(0,0,0,.08)}
.skin input:checked+span{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.skin input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:99px;background:var(--faint)}
.sync.ok i{background:#5E8068}.sync.err i{background:var(--danger)}.sync.busy i{background:var(--soft)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
.scrim{position:absolute;inset:0;background:var(--scrim)}
.sheet{position:relative;width:100%;max-width:520px;max-height:92%;overflow-y:auto;background:var(--sheet);border-radius:26px 26px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 40px rgba(0,0,0,.18);animation:up .22s ease-out}
.sheet.tall{min-height:86%}
@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.sheet-h h2{margin:0;font-family:var(--display);font-size:24px;font-weight:var(--display-w)}
:root[data-skin="chrome"] .sheet-h h2{font-size:19px}
.field{display:flex;flex-direction:column;gap:6px;border:none;margin:0;padding:0;min-width:0}
.field>label,.field legend{font-size:13px;font-weight:600;color:var(--muted);padding:0}
.inp{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--glass-strong);font-size:16px;color:var(--ink)}
textarea.inp{min-height:110px;resize:vertical;line-height:1.5}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg-o{position:relative}
.seg-o input{position:absolute;opacity:0;inset:0;margin:0}
.seg-o span{display:flex;align-items:center;gap:6px;height:40px;padding:0 14px;border-radius:99px;border:1px solid var(--line);background:var(--glass-strong);font-size:13px;font-weight:600}
.seg-o input:checked+span{background:var(--chip-on);color:var(--chip-on-ink);border-color:var(--chip-on-edge)}
.seg-o input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tick{display:flex;align-items:center;gap:10px;min-height:44px;font-size:14px;font-weight:500}
.tick input{width:22px;height:22px;accent-color:var(--accent)}
.actions{display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:1em;margin:0}
.hint{font-size:12px;color:var(--muted);margin:0;line-height:1.5}
.mlist{display:flex;flex-direction:column;gap:8px}
.amt-in{font-family:var(--display);font-size:30px;font-weight:var(--display-w);text-align:center;min-height:64px}
/* home hero */
.hero{position:relative;margin-top:-20px;margin-left:calc(-1 * max(18px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(18px,env(safe-area-inset-right,0px)));min-height:330px;color:#FFFFFF;overflow:hidden}
.hero-bg{position:absolute;inset:0}
.hero-bg svg,.hero-bg img{width:100%;height:100%;display:block;object-fit:cover}
.hero-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.18) 0%,rgba(0,0,0,0) 30%,rgba(0,0,0,.05) 60%,rgba(0,0,0,.22) 100%)}
.hero-fade{position:absolute;left:0;right:0;bottom:0;height:90px;background:linear-gradient(180deg,transparent,var(--bg1))}
.hero-in{position:relative;display:flex;flex-direction:column;gap:6px;padding:16px max(18px,env(safe-area-inset-right,0px)) 74px max(18px,env(safe-area-inset-left,0px));text-shadow:0 1px 12px rgba(0,0,0,.25)}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}
.wordmark{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:600;font-size:38px;line-height:1;letter-spacing:-.01em}
.wordmark sup{font-size:16px;font-style:normal;margin-left:2px}
.tagline{display:block;font-size:11px;font-weight:500;letter-spacing:.04em;margin-top:4px;opacity:.95}
.hero-btn{position:relative;background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.35);color:#FFFFFF;backdrop-filter:blur(8px)}
.hero-btn i{position:absolute;top:9px;right:10px;width:9px;height:9px;border-radius:99px;background:#E5484D;border:1.5px solid #FFFFFF}
.avatar{width:48px;height:48px;border-radius:99px;overflow:hidden;border:2px solid rgba(255,255,255,.85);background:var(--chrome);color:var(--on-chrome);display:flex;align-items:center;justify-content:center;font-family:'Cormorant Garamond',Georgia,serif;font-size:22px;font-weight:700;flex-shrink:0;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.avatar img{width:100%;height:100%;object-fit:cover}
.hero-date{font-size:14px;font-weight:500;opacity:.95}
.hero-greet{margin:0;font-family:'Cormorant Garamond',Georgia,serif;font-size:38px;font-weight:600;line-height:1.05}
.hero-greet em{font-style:italic;font-weight:500}
.quote{align-self:flex-start;margin-top:12px;display:flex;gap:8px;align-items:flex-start;max-width:290px;padding:12px 16px;border-radius:16px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.4);color:#FFFFFF;text-align:left;font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-size:18px;line-height:1.25;backdrop-filter:blur(6px)}
.quote b{font-size:28px;line-height:.8;font-style:normal}
.qa-row{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:-62px;position:relative;z-index:2}
.qa{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:78px;border-radius:18px;font-size:12px;font-weight:500;color:var(--ink);background:var(--glass-strong);border:1px solid var(--edge);box-shadow:0 8px 20px var(--shadow)}
.qa svg{color:var(--accent)}
.hc-card{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius);width:100%;text-align:left;color:inherit}
.hc-card .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.hc-card b{font-size:15px;font-weight:700}
.hc-card small{font-size:13px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emo-circle{width:44px;height:44px;border-radius:99px;display:flex;align-items:center;justify-content:center;font-size:28px;background:var(--glass-strong);border:1px solid var(--line);flex-shrink:0}
.chev{color:var(--muted);display:flex}
.hc-card.deep b{color:var(--deep-ink)}
.focus{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:var(--radius)}
.focus-in{display:flex;gap:12px;align-items:stretch}
.focus ul{list-style:none;margin:0;padding:0;flex:1;min-width:0;display:flex;flex-direction:column}
.fitem{display:flex;align-items:center;gap:10px;min-height:36px;width:100%;text-align:left;font-size:14px}
.fitem span:last-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem .box{width:20px;height:20px;border-radius:5px}
.fitem.done span:last-child{color:var(--faint);text-decoration:line-through}
.focus .mt{width:120px;flex-shrink:0;aspect-ratio:auto;min-height:96px;border-radius:14px}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:8px}

/* ---------- dates ---------- */
function pad(n){ return (n < 10 ? '0' : '') + n; }

  var doc = parseDoc(html);

    Array.prototype.slice.call(node.childNodes).forEach(function(c){
      if (c.nodeType === 1){
