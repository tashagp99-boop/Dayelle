name: Build Dayelle APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Use the Android SDK already on the runner
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "sdk.dir=${ANDROID_HOME:-$ANDROID_SDK_ROOT}" > android/local.properties

      - name: Install packages
        run: npm ci

      - name: Build web files and copy them into the Android project
        run: npm run sync

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Dayelle-0.6.${{ github.run_number }}.apk

      - name: Keep a copy on this run
        uses: actions/upload-artifact@v4
        with:
          name: Dayelle-APK
          path: Dayelle-*.apk

      - name: Publish as the "latest" download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Dayelle-*.apk \
            --title "Dayelle 0.6.${{ github.run_number }}" \
            --notes "Download the .apk below on your Android phone and open it to install or update. Your data stays on the phone."
